# TIPTAP Tanzania – Nginx (HTTP bootstrap; enable SSL after certbot)
# App: https://tiptapafrica.co.tz

upstream php_fpm {
    server app:9000;
    keepalive 32;
}

server {
    listen 80;
    server_name tiptapafrica.co.tz www.tiptapafrica.co.tz;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    root  /var/www/html/public;
    index index.php index.html;

    client_max_body_size 300M;
    client_body_timeout  300s;

    add_header X-Frame-Options        "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/javascript application/json application/javascript text/xml application/xml image/svg+xml;

    # Database administration must use an SSH tunnel or private network.
    location = /database {
        return 404;
    }

    location ^~ /database/ {
        return 404;
    }

    location ^~ /serve-storage/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /storage/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Only Laravel's front controller may execute as PHP.
    location = /index.php {
        try_files $uri =404;
        fastcgi_pass   php_fpm;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $realpath_root/index.php;
        include        fastcgi_params;
        fastcgi_read_timeout 300s;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~* /build/.+\.(js|css|woff2?|ttf|eot|svg|png|jpe?g|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg)$ {
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    access_log /var/log/nginx/tiptap_tz_access.log;
    error_log  /var/log/nginx/tiptap_tz_error.log warn;
}

server {
    listen 80 default_server;
    server_name _;
    return 444;
}
